[develop]
script_dir=$base/lib/esp32_serial_bridge

[install]
install_scripts=$base/lib/esp32_serial_bridge

[flake8]
max-line-length = 100
# D1xx: missing docstrings deferred — add in a dedicated docstring pass
# B902: broad except acceptable for I2C hardware operations
extend-ignore = D1,B902
application-import-names = esp32_serial_bridge
import-order-style = google

[pydocstyle]
# D212 (summary on first line) is our convention; D213 conflicts with it.
# D406/D407/D413: NumPy-style section formatting — we use Google style.
add_ignore = D213,D406,D407,D413
