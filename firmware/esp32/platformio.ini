[env:esp32-s3-devkitc-1]
platform = espressif32@^6.8.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; espressif32 6.8.x bundles arduino-esp32 ~3.2.x.
; DO NOT upgrade to a version that bundles arduino-esp32 >= 3.3.6:
; that release has a UART pin-assignment regression that silently breaks
; Serial1.begin() with custom RX/TX pins (our micro-ROS transport on GPIO 17/18).

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

monitor_speed = 921600
upload_protocol = esptool
upload_port = /dev/ttyACM0
upload_flags =
    --before=default-reset
    --after=hard-reset
extra_scripts = pre:link_microros.py

lib_deps =
    https://github.com/micro-ROS/micro_ros_arduino/archive/refs/tags/v2.0.8-jazzy.zip
    adafruit/Adafruit BNO055 @ ^1.6.3
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    adafruit/Adafruit INA219 @ ^1.2.1
    madhephaestus/ESP32Encoder @ ^0.10.1
