[env:esp32-s3-devkitc-1]
platform = espressif32@^6.8.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; Installed: espressif32 7.0.0, framework-arduinoespressif32 3.20017 (= arduino-esp32 2.0.17).
; motors.cpp uses the 2.x LEDC API (ledcSetup/ledcAttachPin/ledcWrite by channel).
; Do not upgrade the framework without checking the LEDC API — 3.x uses ledcAttach(pin,freq,res).

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -Wno-unused-result

monitor_speed = 921600
upload_protocol = esptool
upload_port = /dev/ttyACM0
upload_flags =
    --before=default_reset
    --after=hard_reset
extra_scripts = pre:link_microros.py

lib_deps =
    https://github.com/micro-ROS/micro_ros_arduino/archive/refs/tags/v2.0.8-jazzy.zip
    adafruit/Adafruit BNO055 @ ^1.6.3
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    adafruit/Adafruit INA219 @ ^1.2.1
    madhephaestus/ESP32Encoder @ ^0.10.1
